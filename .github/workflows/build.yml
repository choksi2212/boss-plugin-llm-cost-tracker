name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

# The reusable plugin-release workflow publishes a GitHub Release and tags
# the commit; both need write access to repo contents. Without this the
# downstream workflow 403s on the release/tag create.
permissions:
  contents: write

jobs:
  release:
    uses: risa-labs-inc/BossConsole-Releases/.github/workflows/plugin-release.yml@main
    with:
      boss_plugin_api_version: 'latest'
    secrets:
      BOSS_STORE_PLUGIN_PUBLISH_KEY: ${{ secrets.BOSS_STORE_PLUGIN_PUBLISH_KEY }}
